name: Build and playtest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install GBDK 2020 4.5.0
        shell: bash
        run: |
          mkdir -p tools
          curl --fail --location --retry 3 https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz --output tools/gbdk-linux64.tar.gz
          echo 'd7857a5f6d135ee4c249043ca26aad9f2ec8ab5d4106d97720d404114f42605c  tools/gbdk-linux64.tar.gz' | sha256sum --check
          tar -xzf tools/gbdk-linux64.tar.gz -C tools
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build ROM
        run: sh ./build.sh
      - name: Check menus, pause, sound, and mute
        run: python verify.py
      - name: Play the original eight games
        run: python playtest.py
      - name: Play the added games and solve all 44 puzzles
        run: python playtest_more.py
      - name: Package verified ROM and public source
        run: python package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flight-arcade
          path: |
            build/FlightArcade.gbc
            FlightArcade.zip
            verification/rom-manifest.json
