name: Build and playtest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install GBDK 2020 4.5.0
        shell: bash
        run: |
          mkdir -p tools
          curl --fail --location --retry 3 https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz --output tools/gbdk-linux64.tar.gz
          echo 'd7857a5f6d135ee4c249043ca26aad9f2ec8ab5d4106d97720d404114f42605c  tools/gbdk-linux64.tar.gz' | sha256sum --check
          tar -xzf tools/gbdk-linux64.tar.gz -C tools
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build ROM
        run: sh ./build.sh
      - name: Check menus, pause, sound, and mute
        run: python verify.py
      - name: Play the original eight games
        run: python playtest.py
      - name: Play the added games and solve all 44 puzzles
        run: python playtest_more.py
      - name: Audit back, cancel, pause, replay, and exit routes in all 16 games
        run: python verify_navigation.py
      - name: Package verified ROM and public source
        run: python package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flight-arcade
          path: |
            build/FlightArcade.gbc
            FlightArcade.zip
            verification/rom-manifest.json

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the build that passed every check
        run: gh run download "$GITHUB_RUN_ID" --name flight-arcade --dir release
      - name: Verify release contents and navigation evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,json
          root=Path('release')
          manifest=json.loads((root/'verification/rom-manifest.json').read_text())
          rom=(root/'build/FlightArcade.gbc').read_bytes()
          assert hashlib.sha256(rom).hexdigest()==manifest['sha256']
          with ZipFile(root/'FlightArcade.zip')as archive:
              assert archive.testzip()is None
              assert archive.read('FlightArcade/build/FlightArcade.gbc')==rom
              for name in archive.namelist():
                  assert not any(part in ('private','tools','.git','..')for part in Path(name).parts)
                  assert not name.endswith(('.sav','.ram','.rtc','delivery.json'))
              navigation=json.loads(archive.read('FlightArcade/verification/navigation-results.json'))
              assert navigation['passed']and len(navigation['results'])==16
              assert navigation['rom_sha256']==manifest['sha256']
              assert archive.read('FlightArcade/LICENSE').startswith(b'MIT License')
          print('Verified release ROM and all 16 navigation routes:',manifest['sha256'])
          PY
      - name: Publish the tested release
        run: |
          gh release create "$RELEASE_TAG" \
            release/build/FlightArcade.gbc \
            release/FlightArcade.zip \
            release/verification/rom-manifest.json \
            --target "$GITHUB_SHA" \
            --title "Flight Arcade $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md
      - name: Verify the public ROM download
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/FlightArcade.gbc" \
            --output release/public-download.gbc
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('release')
          expected=json.loads((root/'verification/rom-manifest.json').read_text())['sha256']
          assert hashlib.sha256((root/'public-download.gbc').read_bytes()).hexdigest()==expected
          print('Public release download verified:',expected)
          PY
